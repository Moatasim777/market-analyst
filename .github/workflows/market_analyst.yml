name: Level 1 Market Analyst

on:
  schedule:
    - cron: "0 * * * *"   # every 30 minutes, UTC. Edit to change frequency.
  workflow_dispatch: {}       # lets you trigger it manually from the GitHub app too

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python market_analyst_notify-v1.2.3.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYMBOLS: "BTCUSDT"
